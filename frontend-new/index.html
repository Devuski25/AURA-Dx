<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon set: SVG for modern browsers, multi-res .ico fallback,
         PNGs for legacy contexts, apple-touch for iOS home screen -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E2E24" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font stylesheet is loaded without blocking the first paint.

         A stylesheet in <head> is render-blocking: the browser downloads it
         and waits for it before painting anything. That request goes to a
         third-party origin, so it also costs a DNS lookup and a TLS
         handshake on every cold load, on the clinic's connection. The text
         renders immediately in the fallback face and swaps when the real one
         arrives -- `display=swap` already did that -- so there is nothing to
         lose by not waiting for it.

         `media="print"` is the standard way to make a stylesheet
         non-blocking, and the `onload` handler puts it back to `all` once
         it has arrived. The <noscript> copy is for the rare browser with
         scripting off, where the trick would otherwise leave the font
         unstyled for good.

         Both families the app actually draws are in this one request:
         Space Grotesk for the display face and IBM Plex Mono for the
         technical one, plus Poppins for the public site, which sets it on
         its own wrapper. Inter and Manrope were in the list and nothing
         ever asked for them.

         One request, not two: the same stylesheet used to be fetched
         twice -- once by this <link> and once by an @import inside
         index.css, which is render-blocking and so made the careful
         non-blocking work here pointless. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>AURA-Dx - AI-Assisted Respiratory Screening</title>
    <meta name="description" content="AURA-Dx (Acoustic Unit for Respiratory Assessment) screens breathing audio for COPD, Pneumonia, and healthy lungs through an acoustic AI classification pipeline." />

    <!-- Canonical host.

         wrangler.jsonc binds auradx.xyz AND www.auradx.xyz as custom domains,
         and the worker serves identical bytes from both with no redirect
         between them. Without a canonical, every public page exists at two
         URLs and search engines have to pick one themselves -- splitting link
         equity and letting the ranking drift between the two.

         Pointing at the apex on every route, including when the visitor is
         already there, is the standard fix and costs nothing. Note the domain
         has NO hyphen: `auradx.xyz`, not `aura-dx.xyz`. The product name is
         "AURA-Dx" with one, because that is the product name, not the domain. -->
    <link rel="canonical" href="https://auradx.xyz/" />

    <!-- Open Graph and Twitter card. Without these, a link shared on
         Facebook, LinkedIn or X renders as a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AURA-Dx" />
    <meta property="og:title" content="AURA-Dx - AI-Assisted Respiratory Screening" />
    <meta property="og:description" content="Screens breathing audio for COPD, Pneumonia, and healthy lungs through an acoustic AI classification pipeline. A research prototype from the University of Rizal System." />
    <meta property="og:url" content="https://auradx.xyz/" />
    <meta property="og:image" content="https://auradx.xyz/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AURA-Dx - AI-Assisted Respiratory Screening" />
    <meta name="twitter:description" content="Screens breathing audio for COPD, Pneumonia, and healthy lungs through an acoustic AI classification pipeline." />
    <meta name="twitter:image" content="https://auradx.xyz/og-image.png" />

    <!-- Not indexed. App routes are behind auth and carry patient data; the
         auth routes exist only to receive an OAuth redirect and should never
         appear in results. React renders these client-side, so the rule lives
         in robots.txt rather than as per-route meta tags. -->
    <meta name="robots" content="index, follow" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('aura-dx:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          // Dark mode only applies inside the logged-in app; public + auth pages stay light.
          var isAppRoute = window.location.pathname.indexOf('/dashboard') === 0
          if (isAppRoute && (theme === 'dark' || (!theme && prefersDark))) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          if (typeof console !== 'undefined') console.warn('Theme initialization failed:', e)
        }
      })()
    </script>
  </head>
  <body class="bg-aura-surface text-aura-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
