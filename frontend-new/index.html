<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon set: SVG for modern browsers, multi-res .ico fallback,
         PNGs for legacy contexts, apple-touch for iOS home screen -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E2E24" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>AURA-Dx - AI-Assisted Respiratory Screening</title>
    <meta name="description" content="AURA-Dx (Acoustic Unit for Respiratory Analysis) screens cough audio for TB, COPD, Pneumonia, and healthy lungs through a two-stage gated AI pipeline." />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('aura-dx:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          // Dark mode only applies inside the logged-in app; public + auth pages stay light.
          var isAppRoute = window.location.pathname.indexOf('/dashboard') === 0
          if (isAppRoute && (theme === 'dark' || (!theme && prefersDark))) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          if (typeof console !== 'undefined') console.warn('Theme initialization failed:', e)
        }
      })()
    </script>
  </head>
  <body class="bg-aura-surface text-aura-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
