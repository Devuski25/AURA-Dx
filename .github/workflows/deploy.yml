name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        working-directory: frontend-new
        run: npm ci

      - name: Build
        working-directory: frontend-new
        run: npm run build
        env:
          # Production env vars baked at build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_INFERENCE_URL: ${{ secrets.VITE_INFERENCE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: aura-dx
          directory: frontend-new/dist
          gitHubDeploymentEnvironment: production